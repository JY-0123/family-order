<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 自動辨識名片點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 max-w-md mx-auto min-h-screen pb-28 text-slate-800">

  <h1 class="text-2xl font-black text-center my-4 text-emerald-600 flex items-center justify-center gap-2">
    <span>📸</span> 菜單照片點餐系統
  </h1>

  <!-- 1. 設定 API Key 與使用者 -->
  <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-slate-200">
    <label class="block font-bold text-slate-700 text-sm mb-1">1. 輸入你的 Gemini API Key：</label>
    <input type="password" id="api-key" placeholder="貼上你的 AI Studio API Key" 
           class="w-full border p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none mb-3">

    <label class="block font-bold text-slate-700 text-sm mb-1">2. 我是誰：</label>
    <div class="flex gap-2" id="name-buttons">
      <button onclick="selectName('爸爸')" class="name-btn flex-1 py-2 border rounded-xl border-slate-200 font-medium">爸爸</button>
      <button onclick="selectName('媽媽')" class="name-btn flex-1 py-2 border rounded-xl border-slate-200 font-medium">媽媽</button>
      <button onclick="selectName('我')" class="name-btn flex-1 py-2 border rounded-xl border-slate-200 font-medium">我</button>
    </div>
  </div>

  <!-- 2. 上傳名片拍照區 -->
  <div class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-slate-200">
    <label class="block font-bold text-slate-700 text-sm mb-2">3. 上傳或拍攝名片菜單：</label>
    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
    <button onclick="document.getElementById('image-input').click()" 
            class="w-full py-3 border-2 border-dashed border-emerald-400 bg-emerald-50 text-emerald-700 font-bold rounded-xl text-center flex justify-center items-center gap-2 hover:bg-emerald-100 transition">
      <span>📷</span> 點擊拍照 / 上傳名片圖片
    </button>
    <img id="preview-img" class="w-full rounded-xl mt-3 hidden border" alt="名片預覽">
    
    <button id="scan-btn" onclick="scanMenuWithAI()" class="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl text-base shadow-md mt-3 hidden active:scale-95 transition">
      🤖 開始用 AI 辨識菜單
    </button>
    <p id="loading-text" class="text-xs text-center text-emerald-600 mt-2 font-bold hidden">⏳ AI 辨識菜單中，請稍候約 3~5 秒...</p>
  </div>

  <!-- 3. AI 自動產生的點餐清單 -->
  <div id="menu-container" class="bg-white p-4 rounded-2xl shadow-sm mb-4 border border-slate-200 hidden">
    <h2 class="font-bold text-slate-700 mb-3 text-sm flex items-center justify-between">
      <span>4. 選擇餐點 (AI 自動解析結果)</span>
      <span class="text-xs text-slate-400 font-normal">可手動調整數量</span>
    </h2>
    <div id="menu-list" class="space-y-3"></div>

    <div class="mt-4 pt-3 border-t">
      <label class="block text-xs font-bold text-slate-500 mb-1">特別備註（甜度冰塊/不加蔥等）：</label>
      <input type="text" id="custom-remark" placeholder="例如：牛肉麵不要蔥，紅茶去冰" 
             class="w-full border p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-emerald-400 focus:outline-none">
    </div>
  </div>

  <!-- 底部固定發送按鈕 -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t max-w-md mx-auto">
    <button onclick="copyOrder()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-lg shadow-lg active:scale-95 transition flex justify-center items-center gap-2">
      <span>複製 LINE 點餐訊息</span> 📋
    </button>
  </div>

  <script>
    let currentName = localStorage.getItem('userName') || '';
    let apiKey = localStorage.getItem('geminiApiKey') || '';
    let menuItems = [];
    let base64Image = '';

    // 初始化讀取設定
    if (currentName) highlightName(currentName);
    if (apiKey) document.getElementById('api-key').value = apiKey;

    document.getElementById('api-key').addEventListener('change', (e) => {
      apiKey = e.target.value.trim();
      localStorage.setItem('geminiApiKey', apiKey);
    });

    function selectName(name) {
      currentName = name;
      localStorage.setItem('userName', name);
      highlightName(name);
    }

    function highlightName(name) {
      document.querySelectorAll('.name-btn').forEach(btn => {
        if (btn.innerText === name) {
          btn.className = 'name-btn flex-1 py-2 border rounded-xl bg-emerald-500 text-white font-bold border-emerald-500';
        } else {
          btn.className = 'name-btn flex-1 py-2 border rounded-xl border-slate-200 text-slate-700';
        }
      });
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result.split(',')[1];
        const preview = document.getElementById('preview-img');
        preview.src = e.target.result;
        preview.classList.remove('hidden');
        document.getElementById('scan-btn').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    async function scanMenuWithAI() {
      if (!apiKey) {
        alert('請先在上方輸入你的 Gemini API Key！');
        return;
      }

      const scanBtn = document.getElementById('scan-btn');
      const loadingText = document.getElementById('loading-text');
      scanBtn.classList.add('hidden');
      loadingText.classList.remove('hidden');

      const prompt = `請辨識這張菜單圖片，擷取其中的餐點品項與價格。
請只回傳符合格式的 JSON 陣列，不要包含任何 Markdown 標記或無關文字。
格式如下：
[
  {"name": "排骨飯", "price": "90"},
  {"name": "牛肉麵", "price": "120"}
]`;

      try {
        const cleanApiKey = apiKey.trim();
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        
        // 清理 JSON 文字
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsedMenu = JSON.parse(rawText);

        menuItems = parsedMenu.map((item, idx) => ({ ...item, id: idx, qty: 0 }));
        renderMenu();

      } catch (err) {
        alert('辨識失敗，請檢查 API Key 是否正確或圖片是否清晰！');
        console.error(err);
        scanBtn.classList.remove('hidden');
      } finally {
        loadingText.classList.add('hidden');
      }
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      const list = document.getElementById('menu-list');
      list.innerHTML = '';

      menuItems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'flex justify-between items-center py-2.5 border-b border-slate-100';
        row.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${item.name}</span>
            <span class="text-xs text-slate-400 block">${item.price ? '$' + item.price : ''}</span>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 bg-slate-100 rounded-full font-bold text-slate-600">-</button>
            <span id="qty-${item.id}" class="font-bold w-4 text-center text-sm">0</span>
            <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 bg-emerald-500 text-white rounded-full font-bold">+</button>
          </div>
        `;
        list.appendChild(row);
      });

      container.classList.remove('hidden');
    }

    function updateQty(id, change) {
      const item = menuItems.find(i => i.id === id);
      if (item && item.qty + change >= 0) {
        item.qty += change;
        document.getElementById(`qty-${id}`).innerText = item.qty;
      }
    }

    function copyOrder() {
      if (!currentName) {
        alert('請先選擇你是誰喔！');
        return;
      }

      let orderText = `【點餐】${currentName}\n`;
      let hasOrder = false;

      menuItems.forEach(item => {
        if (item.qty > 0) {
          orderText += `• ${item.name} x ${item.qty}\n`;
          hasOrder = true;
        }
      });

      const remark = document.getElementById('custom-remark').value.trim();
      if (remark) {
        orderText += `• 備註：${remark}\n`;
        hasOrder = true;
      }

      if (!hasOrder) {
        alert('請先選擇餐點數量喔！');
        return;
      }

      navigator.clipboard.writeText(orderText).then(() => {
        alert('點餐內容已複製！可以直接貼到 LINE：\n\n' + orderText);
      });
    }
  </script>
</body>
</html>
